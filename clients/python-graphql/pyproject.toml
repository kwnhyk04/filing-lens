# Typed GraphQL client. `make codegen` regenerates filing_lens_graphql_client/ with ariadne-codegen
# from contracts/schema.graphql and clients/operations.graphql; this file is hand-written.
[project]
name = "filing-lens-graphql-client"
version = "0.1.0"
description = "Typed GraphQL client for the FilingLens API."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1,<0.29", "pydantic>=2.8,<3"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "filing_lens_graphql_client"
module-root = ""

# Paths are relative to the repo root, where `make codegen` runs.
[tool.ariadne-codegen]
schema_path = "contracts/schema.graphql"
queries_path = "clients/operations.graphql"
target_package_name = "filing_lens_graphql_client"
target_package_path = "clients/python-graphql"
async_client = false

[tool.ariadne-codegen.scalars.Date]
type = "datetime.date"
