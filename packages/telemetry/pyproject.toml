[project]
name = "filinglens-telemetry"
version = "0.1.0"
description = "Structured JSON logging; tracing and metrics follow."
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.14.0"]
build-backend = "uv_build"
