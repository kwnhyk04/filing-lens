[project]
name = "filinglens-retrieval"
version = "0.1.0"
description = "Hybrid search, rank fusion and the reranker interface."
requires-python = ">=3.12"
dependencies = [
    "filinglens-core",
    "filinglens-db",
    "filinglens-llm",
    "sqlalchemy>=2.1.4",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
