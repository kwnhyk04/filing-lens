[project]
name = "filinglens-sec-client"
version = "0.1.0"
description = "EDGAR client with the shared rate limiter and retry policy."
requires-python = ">=3.12"
dependencies = [
    "filinglens-core",
    "filinglens-telemetry",
    "httpx>=0.28.1",
    "redis>=8.1.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.14.0"]
build-backend = "uv_build"
