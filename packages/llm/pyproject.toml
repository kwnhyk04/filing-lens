[project]
name = "filinglens-llm"
version = "0.1.0"
description = "LLM provider client, router, answer generation and citation validation."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "filinglens-core",
    "filinglens-telemetry",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "structlog>=26.1.0",
    # 2.13 and later ship a torch_python.dll that this PC's Smart App Control blocks (2026-10-15);
    # Linux (the images, CI) takes the current torch.
    "torch>=2.12.0,<2.13; sys_platform == 'win32'",
    "torch>=2.12.0; sys_platform != 'win32'",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.14.0"]
build-backend = "uv_build"
