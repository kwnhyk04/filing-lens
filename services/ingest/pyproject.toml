[project]
name = "filinglens-ingest"
version = "0.1.0"
description = "Celery app and ingestion tasks."
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "filinglens-core",
    "filinglens-db",
    "filinglens-llm",
    "filinglens-sec-client",
    "filinglens-telemetry",
    "kombu>=5.6.2",
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "tokenizers>=0.23.3",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.14.0"]
build-backend = "uv_build"
