type Answer {
  answer: String!
  citations: [Citation!]!

  """True when retrieval skipped the reranker after a timeout."""
  degraded: Boolean!
  usage: Usage!

  """True when FilingLens declined to answer; `answer` says why."""
  refused: Boolean!

  """Validation notes, such as sentences removed because a check failed."""
  warnings: [String!]!

  """How the router read the question; null if it was not read."""
  reading: Reading

  """Each amount in the answer with the cited source that holds it."""
  checks: [FigureCheck!]!
}

"""Arithmetic FilingLens did on two cited facts of one unit."""
type Calculation {
  """
  The citations of the two facts it was calculated from, numbered from 1.
  """
  inputs: [Int!]!
}

type Chunk {
  id: ID!
  sectionId: ID!
  text: String!

  """The section the chunk belongs to."""
  section: Section!

  """The filing the chunk comes from."""
  filing: Filing!
}

"""A connection to a list of items."""
type ChunkConnection {
  """Pagination data for this connection"""
  pageInfo: PageInfo!

  """Contains the nodes in this connection"""
  edges: [ChunkEdge!]!
}

"""An edge in a connection."""
type ChunkEdge {
  """A cursor for use in pagination"""
  cursor: String!

  """The item at the end of the edge"""
  node: Chunk!
}

"""
Exactly one of chunkId (filing text), factId (XBRL fact) and calculation is set.
"""
type Citation {
  chunkId: ID
  factId: ID

  """Set for arithmetic on two cited facts; its quote holds the result."""
  calculation: Calculation
  quote: String!
  filingUrl: String!
}

type Company {
  cik: Int!
  ticker: String!
  name: String!

  """This company's filings, newest first."""
  filings(
    formType: FormType = null
    fiscalYear: Int = null

    """Page size: at most 100, or 20 inside another list."""
    first: Int! = 20

    """endCursor from the previous page."""
    after: String = null
  ): FilingConnection!
}

"""A connection to a list of items."""
type CompanyConnection {
  """Pagination data for this connection"""
  pageInfo: PageInfo!

  """Contains the nodes in this connection"""
  edges: [CompanyEdge!]!
}

"""An edge in a connection."""
type CompanyEdge {
  """A cursor for use in pagination"""
  cursor: String!

  """The item at the end of the edge"""
  node: Company!
}

"""Date (isoformat)"""
scalar Date

"""An amount in the answer and the cited source that holds it."""
type FigureCheck {
  """The amount as the answer writes it."""
  text: String!

  """The citation whose source holds it, from 1."""
  citation: Int!

  """The number it matched: the fact's value, or the number as quoted."""
  sourceValue: String!
}

type Filing {
  accessionNumber: String!
  cik: Int!
  formType: FormType!
  filedOn: Date!
  periodEnd: Date!
  fiscalYear: Int!
  fiscalPeriod: FiscalPeriod!
  url: String!

  """The company that filed it."""
  company: Company!
  sections: [Section!]!

  """All text chunks of the filing, in reading order."""
  chunks(
    """Page size: at most 100, or 20 inside another list."""
    first: Int! = 20

    """endCursor from the previous page."""
    after: String = null
  ): ChunkConnection!

  """XBRL facts reported in the filing, optionally one concept."""
  facts(
    concept: String = null

    """Page size: at most 100, or 20 inside another list."""
    first: Int! = 20

    """endCursor from the previous page."""
    after: String = null
  ): FinancialFactConnection!
}

"""A connection to a list of items."""
type FilingConnection {
  """Pagination data for this connection"""
  pageInfo: PageInfo!

  """Contains the nodes in this connection"""
  edges: [FilingEdge!]!
}

"""An edge in a connection."""
type FilingEdge {
  """A cursor for use in pagination"""
  cursor: String!

  """The item at the end of the edge"""
  node: Filing!
}

type FinancialFact {
  id: ID!
  concept: String!
  label: String!
  value: Float!
  unit: String!
  periodStart: Date
  periodEnd: Date!
  fiscalYear: Int!
  fiscalPeriod: FiscalPeriod!
  accessionNumber: String!

  """The company that reported the fact."""
  company: Company!
}

"""A connection to a list of items."""
type FinancialFactConnection {
  """Pagination data for this connection"""
  pageInfo: PageInfo!

  """Contains the nodes in this connection"""
  edges: [FinancialFactEdge!]!
}

"""An edge in a connection."""
type FinancialFactEdge {
  """A cursor for use in pagination"""
  cursor: String!

  """The item at the end of the edge"""
  node: FinancialFact!
}

enum FiscalPeriod {
  FY
  Q1
  Q2
  Q3
  Q4
}

enum FormType {
  FORM_10K
  FORM_10Q
}

"""Information to aid in pagination."""
type PageInfo {
  """When paginating forwards, are there more items?"""
  hasNextPage: Boolean!

  """When paginating backwards, are there more items?"""
  hasPreviousPage: Boolean!

  """When paginating backwards, the cursor to continue."""
  startCursor: String

  """When paginating forwards, the cursor to continue."""
  endCursor: String
}

type Query {
  """Tracked companies in CIK order."""
  companies(
    """Page size: at most 100, or 20 inside another list."""
    first: Int! = 20

    """endCursor from the previous page."""
    after: String = null
  ): CompanyConnection!

  """Ingested filings, newest first."""
  filings(
    cik: Int = null
    formType: FormType = null
    fiscalYear: Int = null

    """Page size: at most 100, or 20 inside another list."""
    first: Int! = 20

    """endCursor from the previous page."""
    after: String = null
  ): FilingConnection!

  """Text chunks of indexed filings by id, in the order given."""
  chunks(
    """
    Up to 20 ids per call, of 1 to 64 characters each. Results keep the order given, hold each id once and leave unknown ids out.
    """
    ids: [ID!]!
  ): [Chunk!]!

  """Financial facts by id, in the order given."""
  facts(
    """
    Up to 20 ids per call, of 1 to 64 characters each. Results keep the order given, hold each id once and leave unknown ids out.
    """
    ids: [ID!]!
  ): [FinancialFact!]!

  """Companies with an indexed filing, and indexed filings."""
  totals: Totals!

  """Answer a question from the filings, with citations."""
  answer(
    question: String!

    """Only these companies (CIKs)."""
    companyIds: [Int!] = null
    fiscalYears: [Int!] = null
  ): Answer!
}

type ReadCompany {
  ticker: String!
  name: String!
}

"""How the router read the question; the answer used this reading."""
type Reading {
  """numeric, textual, comparison or out_of_scope."""
  route: String!
  companies: [ReadCompany!]!

  """Companies the question names that FilingLens does not track."""
  otherCompanies: [String!]!
  fiscalYears: [Int!]!

  """FY, or Q1 to Q4."""
  fiscalPeriod: String

  """The figure asked for, such as revenue."""
  metric: String
}

type Section {
  id: ID!
  item: String!
  title: String!

  """This section's text chunks, in reading order."""
  chunks(
    """Page size: at most 100, or 20 inside another list."""
    first: Int! = 20

    """endCursor from the previous page."""
    after: String = null
  ): ChunkConnection!
}

"""Companies with an indexed filing, and indexed filings."""
type Totals {
  companies: Int!
  filings: Int!
}

type Usage {
  inputTokens: Int!
  outputTokens: Int!
  costUsd: Float!
}
