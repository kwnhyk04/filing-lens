# Production override, applied on top of the development file:
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
# Postgres, RabbitMQ and Redis publish no host ports; every service restarts and has a memory cap.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    shm_size: 256mb # parallel HNSW builds keep their graph in /dev/shm (docs/migrations.md)
    # 1.5 GB covers shm_size, a 512 MB maintenance_work_mem, shared_buffers and connections.
    deploy: { resources: { limits: { memory: 1536M } } }

  redis:
    ports: !reset []
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  rabbitmq:
    ports: !reset []
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  api:
    restart: unless-stopped
    # torch, the query embedder and the reranker run in process.
    deploy: { resources: { limits: { memory: 1536M } } }

  ingest:
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1G } } }

  embed:
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1536M } } }

  otel-collector:
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  jaeger:
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  prometheus:
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  grafana:
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }
