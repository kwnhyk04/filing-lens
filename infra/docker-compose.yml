# Development stack: make dev / make down, or plain docker compose from the repo root (COMPOSE_FILE
# in .env). Every port binds to 127.0.0.1 and comes from .env. Monitoring sits behind the
# `observability` profile and Toxiproxy behind `test`, so a plain `up` starts only what the app needs.
# docker-compose.prod.yml layers the production stack on this file (project filinglens-prod,
# docs/deploy.md).
name: filinglens

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Telemetry is on when .env sets OTEL_EXPORTER_OTLP_ENDPOINT (the host's URL); containers then
  # get the collector's service URL, and an empty value otherwise (docs/monitoring.md).
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:+http://otel-collector:4318}

# Local models: the host's Hugging Face cache (HF_HOME, filled once by `make models`), read-only
# and offline, so containers never download weights.
x-model-environment: &model-environment
  HF_HOME: /var/cache/huggingface
  HF_HUB_OFFLINE: "1"
  RETRIEVAL_EMBEDDING_COLUMN: ${RETRIEVAL_EMBEDDING_COLUMN:-embedding_v2}
x-model-cache: &model-cache
  type: bind
  source: ${HF_HOME:?set HF_HOME to the Hugging Face cache that make models fills}
  target: /var/cache/huggingface
  read_only: true
x-ingest-build: &ingest-build
  context: ..
  dockerfile: infra/Dockerfile
  args: { PACKAGE: filinglens-ingest }

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # psql inside the container then needs no flags (make check-parallel-hnsw).
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
    shm_size: 256mb # parallel HNSW builds keep their graph in /dev/shm (docs/migrations.md)
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"] # Postgres 18 images keep PGDATA below this path
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8.8.3-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    hostname: rabbitmq # fixed node name, so the data volume survives container recreation
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args: { PACKAGE: filinglens-api }
    command: ["python", "-m", "filinglens_api"]
    environment:
      <<: [*app-environment, *model-environment]
      API_KEY: ${API_KEY:?set API_KEY in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-4100}
      RERANK_MODEL: ${RERANK_MODEL:-cross-encoder/ms-marco-TinyBERT-L-2-v2}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-50}
      RERANK_MAX_TOKENS: ${RERANK_MAX_TOKENS:-512}
      RERANK_TIMEOUT_MS: ${RERANK_TIMEOUT_MS:-500}
      AI_ENABLED: ${AI_ENABLED:-false}
      DAILY_AI_TOKEN_BUDGET: ${DAILY_AI_TOKEN_BUDGET:-1000000}
      CLAUDE_DAILY_TOKEN_BUDGET: ${CLAUDE_DAILY_TOKEN_BUDGET:-1500000}
      LLM_MAX_INFLIGHT: ${LLM_MAX_INFLIGHT:-4}
      LLM_PRIMARY: ${LLM_PRIMARY:-gemini:gemini-3.5-flash-lite}
      LLM_ROUTER: ${LLM_ROUTER:-groq:openai/gpt-oss-20b}
      LLM_FALLBACK: ${LLM_FALLBACK:-nvidia:openai/gpt-oss-20b}
      LLM_ANSWER_FALLBACK: ${LLM_ANSWER_FALLBACK:-}
      ANTHROPIC_CREDITS_EXPIRE: ${ANTHROPIC_CREDITS_EXPIRE:-2026-11-10}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: [*model-cache]
    ports: ["127.0.0.1:${API_PORT:-4100}:${API_PORT:-4100}"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:${API_PORT:-4100}/readyz', timeout=7)"]
      interval: 10s
      timeout: 8s
      retries: 6

  ingest:
    build: *ingest-build
    # Every queue but embed and reembed, which the embed service runs.
    command: ["celery", "-A", "filinglens_ingest.worker", "worker", "-Q", "discover,fetch,fetch.retry,parse,chunk,facts"]
    environment:
      <<: *app-environment
      SEC_USER_AGENT: ${SEC_USER_AGENT:?set SEC_USER_AGENT in .env, with your contact for SEC}
    # Raw SEC responses (SEC_CACHE_DIR) in the repo's .cache/sec (gitignored), shared with host
    # runs such as scripts/seed_real.py, so the cache stays on this disk.
    volumes: ["../.cache/sec:/var/cache/filinglens/sec"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/readyz', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 6

  # The embedding stage and the reembed backfill: one process, so one copy of the model, whose
  # torch already uses every core.
  embed:
    build: *ingest-build
    command: ["celery", "-A", "filinglens_ingest.worker", "worker", "-Q", "embed,reembed", "-c", "1", "-n", "embed@%h"]
    environment:
      <<: [*app-environment, *model-environment]
      SEC_USER_AGENT: ${SEC_USER_AGENT:?set SEC_USER_AGENT in .env, with your contact for SEC}
      OTEL_SERVICE_NAME: filinglens-embed
    volumes: [*model-cache]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/readyz', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 6

  # The image is distroless, so it has no healthcheck; Prometheus's `up` covers it.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    profiles: [observability]
    environment:
      API_PORT: ${API_PORT:-4100} # httpcheck probes the API's /readyz
    volumes: ["./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4327}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4328}:4318"
    depends_on: [jaeger]

  # Traces in memory: a restart clears them. The built-in config keeps 100,000 traces; 20,000 fit
  # the prod override's 512 MB.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: [observability]
    command: ["--set=extensions.jaeger_storage.backends.some_storage.memory.max_traces=20000"]
    ports: ["127.0.0.1:${JAEGER_UI_PORT:-16687}:16686"]

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Provisioned datasources and dashboards (folder FilingLens). Anonymous viewers in development
  # only, so screenshots need no password; the prod override turns them off.
  grafana:
    image: grafana/grafana:13.2.4
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/filinglens.yaml:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/filinglens.yaml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_PORT:-3101}:3000"]
    depends_on: [prometheus, jaeger]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: [test]
    ports:
      - "127.0.0.1:${TOXIPROXY_PORT:-8475}:8474"
      - "127.0.0.1:${TOXIPROXY_PROXY_PORTS:-15433-15499}:${TOXIPROXY_PROXY_PORTS:-15433-15499}"

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data: # 15 days or 1 GB of metrics, whichever comes first
