# Production's alert delivery (docs/deploy.md, Alert delivery): every alert to a Discord channel and
# to an inbox. entrypoint.sh writes the webhook and the SMTP password to the files named here, and
# the Gmail addresses over the two placeholders, so this file holds neither.
global:
  # Alertmanager sends no SMTP through a proxy, so mail goes to smtp-relay, which tunnels it through
  # egress-proxy. STARTTLS runs from here to Gmail, its certificate checked against Gmail's name.
  smtp_smarthost: smtp-relay:2525
  smtp_require_tls: true
  smtp_tls_config: { server_name: smtp.gmail.com }
  smtp_from: ALERT_EMAIL_FROM
  smtp_auth_username: ALERT_EMAIL_FROM
  smtp_auth_password_file: /tmp/smtp-password

templates: [/etc/alertmanager/filinglens.tmpl]

# One message per rule, its instances listed: two queues without a consumer make one message. A
# group that changes waits 10 minutes; an alert still firing repeats every 12 hours. The rules'
# keep_firing_for (10 minutes) keeps a flapping condition one alert.
route:
  receiver: filinglens
  group_by: [alertname]
  group_wait: 30s
  group_interval: 10m
  repeat_interval: 12h

receivers:
  - name: filinglens
    discord_configs:
      - webhook_url_file: /tmp/discord-webhook-url
        http_config: { proxy_url: http://egress-proxy:3130 }
        title: '{{ template "filinglens.title" . }}'
        message: '{{ template "filinglens.text" . }}'
        send_resolved: true
    # Firing messages only: the inbox gets what needs action, and Discord also says when it ends.
    # No HTML part, since Alertmanager's default one links to Alertmanager.
    email_configs:
      - to: ALERT_EMAIL_TO
        headers: { Subject: '{{ template "filinglens.title" . }}' }
        text: '{{ template "filinglens.text" . }}'
        html: ""
        send_resolved: false
