# Egress proxy of production (infra/docker-compose.prod.yml, docs/deploy.md). The api, the tailscale
# container, Alertmanager and its mail relay sit on internal networks and reach the internet only
# through this: CONNECT to the hosts each one needs, on 443 (587 for the mail relay), nothing in a
# private range, nothing cached. Each client has its own port, so the rules match on the port's name.
http_port 3128 name=api
http_port 3129 name=tailscale
http_port 3130 name=alertmanager
http_port 3131 name=smtp_relay

acl from_api myportname api
acl from_tailscale myportname tailscale
acl from_alertmanager myportname alertmanager
acl from_smtp_relay myportname smtp_relay
# Each port serves one client, by its fixed address (infra/docker-compose.prod.yml): the api and
# tailscale on `outbound`, Alertmanager and the relay on `alerting`. So a compromised api cannot
# borrow tailscale's way out to Tailscale's servers, or the relay's to Gmail.
acl api_ip src 10.231.232.2
acl tailscale_ip src 10.231.232.3
acl alertmanager_ip src 10.231.232.18
acl smtp_relay_ip src 10.231.232.19
acl https_port port 443
acl smtp_port port 587
acl CONNECT method CONNECT

# Loopback, private, link-local, CGNAT and other non-public ranges, IPv4 and IPv6. A name is checked
# by every address it resolves to, so host.docker.internal (Docker Desktop's 192.168.65.254) is
# refused like the address itself. Squid keeps IPv4 as IPv4-mapped IPv6, so the IPv4 ranges cover
# mapped addresses too (::ffff:0:0/96 would mean all of IPv4).
acl non_public dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24
acl non_public dst 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl non_public dst ::/128 ::1/128 64:ff9b::/96 fc00::/7 fe80::/10 ff00::/8

# -n: no lookup, so a bare IP address never matches a name. The api: the model providers production
# calls (docs/deploy.md, Models). Tailscale: its control plane and Funnel's certificate, plus its
# relays. With UDP blocked, tailscaled measures every region's relays over HTTPS (FreightAudit's
# node asked for 87 names in 28 regions), so one pattern covers them and any that Tailscale adds or
# renames. Its log upload is off (--no-logs-no-support), so Tailscale's log server is not here.
# Alertmanager: Discord's webhooks. The mail relay: Gmail's SMTP, which Alertmanager reaches with
# STARTTLS through it (docs/deploy.md, Alert delivery).
acl api_hosts dstdomain -n api.anthropic.com api.groq.com generativelanguage.googleapis.com integrate.api.nvidia.com
acl tailscale_hosts dstdomain -n acme-v02.api.letsencrypt.org controlplane.tailscale.com
acl tailscale_derp dstdom_regex -n ^derp[0-9]+[a-z]*[.]tailscale[.]com$
acl alertmanager_hosts dstdomain -n discord.com
acl smtp_relay_hosts dstdomain -n smtp.gmail.com

http_access deny !CONNECT
# SMTP's port only on the mail relay's proxy port, HTTPS's on every other.
http_access deny from_smtp_relay !smtp_port
http_access deny !from_smtp_relay !https_port
http_access deny non_public
http_access allow from_api api_ip api_hosts
http_access allow from_tailscale tailscale_ip tailscale_hosts
http_access allow from_tailscale tailscale_ip tailscale_derp
http_access allow from_alertmanager alertmanager_ip alertmanager_hosts
http_access allow from_smtp_relay smtp_relay_ip smtp_relay_hosts
http_access deny all

# No protocol but the four proxy ports, and no peers. ICP, HTCP and SNMP default to port 0 already
# and no cache_peer line exists, so these restate the defaults; digest generation defaults to on.
icp_port 0
htcp_port 0
snmp_port 0
digest_generation off

# A tunnel only: nothing stored, nothing on disk.
cache deny all
cache_mem 0 MB
pid_filename none
coredump_dir /tmp
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
visible_hostname egress-proxy
shutdown_lifetime 1 seconds
