# api, ingest and embed push OTLP/HTTP here (docs/monitoring.md). Traces go to Jaeger; metrics are
# re-exposed for Prometheus on :8889, with exemplars. The collector also probes the API's /readyz
# every 15 s (httpcheck) and serves its own metrics on :8888.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  httpcheck:
    collection_interval: 15s
    targets:
      - endpoint: http://api:${env:API_PORT}/readyz
        method: GET
        timeout: 10s # the API's own checks take at most 2 s each

processors:
  memory_limiter: # drops data before the container's memory limit is reached
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true # exemplars: a latency point links to its trace in Grafana
    metric_expiration: 1m # a stopped process's series go after a minute, its gauges included

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp, httpcheck]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
