name: Python workspace
description: uv, the locked workspace with its dev group, and the pinned local models when asked.
inputs:
  models:
    description: Also restore the pinned Hugging Face models into HF_HOME, fetching them on a miss.
    default: "false"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: 0.12.23 # the uv in infra/Dockerfile
        enable-cache: true
        cache-dependency-glob: uv.lock
    - run: uv sync --frozen
      shell: bash
    - if: inputs.models == 'true'
      id: models
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/huggingface
        key: hf-${{ hashFiles('packages/llm/src/filinglens_llm/local.py') }}
    - if: inputs.models == 'true' && steps.models.outputs.cache-hit != 'true'
      run: make models
      shell: bash
