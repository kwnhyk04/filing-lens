# Weekly version updates, one grouped PR per ecosystem, each release at least 7 days old.
# Dependabot PRs get no repository secrets, so their answer eval shows NOT RUN (ci.yml).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: ["/web", "/clients/ts"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # openapi-typescript 7.13.0, its newest release, accepts only typescript ^5.x, so a typescript 7 bump fails npm ci with ERESOLVE.
    # Lift this once an openapi-typescript release accepts typescript 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
