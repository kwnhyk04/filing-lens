[project]
name = "filinglens"
version = "0.1.0"
description = "Answers analyst questions over SEC filings with verifiable citations."
requires-python = ">=3.12"
# The root is a virtual project: depending on every member makes `uv sync` install the whole workspace.
dependencies = [
    "filinglens-api",
    "filinglens-core",
    "filinglens-db",
    "filinglens-ingest",
    "filinglens-llm",
    "filinglens-retrieval",
    "filinglens-sec-client",
    "filinglens-telemetry",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
filinglens-api = { workspace = true }
filinglens-core = { workspace = true }
filinglens-db = { workspace = true }
filinglens-ingest = { workspace = true }
filinglens-llm = { workspace = true }
filinglens-retrieval = { workspace = true }
filinglens-sec-client = { workspace = true }
filinglens-telemetry = { workspace = true }
# Generated clients (`make codegen`), installed for the contract tests.
filing-lens-api-client = { path = "clients/python", editable = true }
filing-lens-graphql-client = { path = "clients/python-graphql", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["clients"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["filinglens_*"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["packages/*/src"]
exclude = ["clients", "web", "**/node_modules", "**/__pycache__", "**/.*"]
extraPaths = ["scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
# The root holds network_guard.py; tests seed with scripts/seed_fake.py.
pythonpath = [".", "scripts"]
testpaths = ["packages", "services", "evals"]
markers = [
    "unit: no Docker and no network; conftest.py adds it to every test without another marker",
    "integration: needs Docker; starts throwaway containers with Testcontainers",
    "e2e: drives the running stack or the UI end to end (none yet; Playwright in step 9)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.alembic]
script_location = "%(here)s/packages/db/src/filinglens_db/migrations"

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "filing-lens-api-client",
    "filing-lens-graphql-client",
    "httpx2>=2.13.1",
    # 6.156 and later ship a Rust extension that this PC's Application Control blocks.
    "hypothesis>=6.155.7,<6.156",
    "openapi-python-client>=0.29.1",
    "pre-commit>=4.7.0",
    "psycopg[binary]>=3.3.6",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "strawberry-graphql[cli]>=0.334.4",
    "testcontainers>=4.15.0",
]
